<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sinterklaas Piraten Speurtocht</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#d5b47a;
}

#map{
    position:relative;
    width:100%;
    height:100vh;

    background-image:url('https://images.unsplash.com/photo-1524661135-423995f22d0b?q=80&w=1600');
    background-size:cover;
    background-position:center;
}

.cross{
    position:absolute;
    width:50px;
    height:50px;
    border-radius:50%;
    background:red;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    cursor:pointer;
    box-shadow:0 0 15px rgba(0,0,0,0.5);
}

.locked{
    opacity:.3;
    pointer-events:none;
}

.unlocked{
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0% {transform:scale(1);}
    50% {transform:scale(1.15);}
    100% {transform:scale(1);}
}

#popup{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    justify-content:center;
    align-items:center;
}

.card{
    width:90%;
    max-width:500px;
    background:white;
    padding:20px;
    border-radius:15px;
    text-align:center;
}

input{
    padding:10px;
    width:80%;
    margin:10px;
}

button{
    padding:10px 20px;
    background:#c00;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

#resultImage{
    width:100%;
    border-radius:10px;
    margin-top:15px;
    display:none;
}

#message{
    font-size:20px;
    font-weight:bold;
    margin-top:10px;
}
</style>
</head>

<body>

<div id="map">

<div class="cross unlocked" id="loc1" style="top:20%; left:20%;">❌</div>
<div class="cross locked" id="loc2" style="top:35%; left:60%;">❌</div>
<div class="cross locked" id="loc3" style="top:65%; left:25%;">❌</div>
<div class="cross locked" id="loc4" style="top:45%; left:80%;">❌</div>
<div class="cross locked" id="loc5" style="top:75%; left:70%;">❌</div>

</div>

<div id="popup">
  <div class="card">

    <h2 id="title">Locatie</h2>

    <p>Voer de geheime code in</p>

    <input id="answer" type="text">

    <br>
    <button onclick="checkCode()">Controleer</button>

    <div id="message"></div>

    <img id="resultImage">

    <br><br>
    <button onclick="closePopup()">Sluiten</button>

  </div>
</div>

<script>

let currentLocation = 0;

const locations = [
{
code:"PEPERNOOT",
nextPhoto:"https://picsum.photos/500/300?random=1",
next:"loc2"
},
{
code:"PAARD",
nextPhoto:"https://picsum.photos/500/300?random=2",
next:"loc3"
},
{
code:"STOOMBOOT",
nextPhoto:"https://picsum.photos/500/300?random=3",
next:"loc4"
},
{
code:"MIJTER",
nextPhoto:"https://picsum.photos/500/300?random=4",
next:"loc5"
},
{
code:"PAKJESAVOND",
nextPhoto:"",
next:null
}
];

let attempts = 3;

document.querySelectorAll(".cross").forEach((cross,index)=>{
    cross.addEventListener("click",()=>{
        openLocation(index);
    });
});

function openLocation(index){
    currentLocation=index;
    attempts=3;

    document.getElementById("popup").style.display="flex";
    document.getElementById("title").innerText =
    "Locatie " + (index+1);

    document.getElementById("message").innerHTML="";
    document.getElementById("resultImage").style.display="none";
    document.getElementById("answer").value="";
}

function closePopup(){
 document.getElementById("popup").style.display="none";
}

function horseSound(){
 const audio = new SpeechSynthesisUtterance(
 "Hiiiiii Hiiiiii"
 );
 speechSynthesis.speak(audio);
}

function fartSound(){
 const audio = new SpeechSynthesisUtterance(
 "Prrrrrrrt"
 );
 speechSynthesis.speak(audio);
}

function checkCode(){

 let value =
 document.getElementById("answer")
 .value
 .toUpperCase()
 .trim();

 let location = locations[currentLocation];

 if(value === location.code){

      horseSound();

      const msg =
      document.getElementById("message");

      const img =
      document.getElementById("resultImage");

      if(currentLocation < 4){

          msg.innerHTML =
          "🐎 GOED!<br><br>Zoek nu deze locatie:";

          img.src = location.nextPhoto;
          img.style.display="block";

          document
          .getElementById(location.next)
          .classList.remove("locked");

          document
          .getElementById(location.next)
          .classList.add("unlocked");

      } else {

          msg.innerHTML =
          `
          <h2>🎉 GEFELICITEERD 🎉</h2>
          <h3>Je hebt de zak van Sinterklaas gevonden!</h3>
          🎁🎁🎁
          `;

      }

 } else {

      attempts--;

      fartSound();

      if(attempts > 0){

          document.getElementById("message")
          .innerHTML=
          `
          😢 Huilende Piet<br><br>
          Foute code!<br>
          Nog ${attempts} pogingen.
          `;

      }
      else{

          document.getElementById("message")
          .innerHTML=
          `
          😭 Piet weet het ook niet meer!<br><br>
          Tip: kijk nog eens goed rond.
          `;
      }

 }

}
</script>

</body>
</html>
